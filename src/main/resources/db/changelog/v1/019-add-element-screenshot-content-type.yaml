databaseChangeLog:
  - changeSet:
      id: 019-add-element-screenshot-content-type
      author: trails
      changes:
        - addColumn:
            tableName: element_screenshot_entity
            columns:
              - column:
                  name: content_type
                  type: VARCHAR(100)
        - update:
            tableName: element_screenshot_entity
            columns:
