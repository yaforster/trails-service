databaseChangeLog:
  - changeSet:
      id: 015-add-downloaded-document-text-check-action-1
      author: codex
      changes:
        - addColumn:
            tableName: action_details_entity
            columns:
              - column:
                  name: document_file_name
                  type: varchar(255)
              - column:
                  name: document_expected_text
                  type: varchar(2048)
              - column:
                  name: document_case_sensitive
                  type: boolean
  - changeSet:
      id: 015-add-downloaded-document-text-check-action-2
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
      changes:
        - sql:
            sql: ALTER TABLE action_details_entity MODIFY document_case_sensitive bit(1) DEFAULT b'0'
