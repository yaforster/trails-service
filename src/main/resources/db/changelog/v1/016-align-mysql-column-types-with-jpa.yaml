databaseChangeLog:
  - changeSet:
      id: 016-align-result-success-type
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - columnExists:
            tableName: result_entity
            columnName: success
      changes:
        - sql:
            sql: ALTER TABLE result_entity MODIFY success bit(1) NOT NULL
  - changeSet:
