<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Test Path Report</title>
    <th:block th:replace="~{print/fragments/print-common-styles :: printCommonStyles}"></th:block>
    <style>
        @page {
            size: A4;
            margin: 2mm;
        }

        body {
            margin: 0;
            padding: 8px;
        }

        .report {
            margin: 0 auto;
            max-width: 920px;
        }

        .header {
            margin-bottom: 10px;
            padding: 10px;
        }

        .header h1 {
            margin: 0 0 6px 0;
        }

        .header-meta {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .header-meta-item {
            padding: 6px 7px;
        }

        .header-meta-label {
            display: block;
            margin-bottom: 1px;
        }

        .action-grid {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .action-field {
            min-height: 40px;
            padding: 5px 7px 3px;
        }

        .action-field-label {
            display: block;
            margin-bottom: 1px;
        }

        .action-field-value {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .action-screenshot-wrap {
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
            padding: 6px;
        }

        .action-screenshot {
            display: block;
            height: auto;
            margin: 0;
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            width: auto;
        }

    </style>
</head>
<body>
<main class="report">
    <section class="header">
        <h1>Test Path Result</h1>
        <div class="header-meta">
            <div class="header-meta-item">
                <span class="header-meta-label">Database ID (PersistedTestPathResult)</span>
                <span class="header-meta-value" th:text="${context.pathResultId}">0</span>
            </div>
            <div class="header-meta-item">
                <span class="header-meta-label">TestSet Result ID</span>
                <span class="header-meta-value" th:text="${context.testSetResultId}">0</span>
            </div>
            <div class="header-meta-item">
                <span class="header-meta-label">Executed In browser:</span>
                <span class="header-meta-value" th:text="${context.browser}">UNKNOWN</span>
            </div>
            <div class="header-meta-item">
                <span class="header-meta-label">Actions in Path</span>
                <span class="header-meta-value" th:text="${#lists.size(context.actionResults)}">0</span>
            </div>
        </div>
    </section>

    <th:block th:if="${#lists.isEmpty(context.actionResults)}">
        <section class="print-empty-state" style="padding:16px;">
            No action results available.
        </section>
    </th:block>

    <th:block th:each="actionResult : ${context.actionResults}">
        <th:block th:replace="~{print/fragments/action-result :: actionResultCard(${actionResult})}"></th:block>
    </th:block>
</main>
</body>
</html>
